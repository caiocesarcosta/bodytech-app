# gradle/libs.versions.toml

[versions]
# SDK e Targets
compileSdk = "35"
minSdk = "26"
targetSdk = "35"
jvmTarget = "11"

# Versões do Aplicativo
versionCode = "1"
versionName = "1.0"

# --- Versões de Plugins ---
agp = "8.7.2" # Android Gradle Plugin
androidLibraryPlugin = "8.9.0" # AGP para módulos library (versão separada)
kotlin = "2.1.20"
ksp = "2.1.20-1.0.31"
kotlinComposeCompiler = "2.0.21"
hiltAndroid = "2.51.1"
googleServices = "4.4.2" # Versão do Google Services (Firebase)

# --- Versões de Bibliotecas ---
activityCompose = "1.10.1"
appcompat = "1.7.0"
composeBom = "2025.05.01"
composeMaterial3 = "1.3.2"
composeRuntimeLivedata = "1.8.2"
constraintLayout = "2.2.1"
coreKtx = "1.16.0"
coroutinesAndroid = "1.7.3"
coroutinesPlayServices = "1.7.3"
espresso = "3.6.1"
extJunit = "1.2.1"
firebaseAuthKtx = "23.2.1"
firebaseBom = "33.14.0"
firebaseFirestoreKtx = "25.1.4"
gson = "2.11.0"
hiltNavigationCompose = "1.2.0"
hiltNavigationFragment = "1.2.0"
junit = "4.13.2"
lifecycleRuntimeComposeAndroid = "2.9.0"
lifecycleRuntimeKtx = "2.9.0"
lifecycleViewModelCompose = "2.9.0"
material = "1.12.0"
navigationCompose = "2.9.0"
retrofit = "2.9.0"
retrofitGsonConverter = "2.9.0"
room = "2.7.1"
testComposeBom = "2025.05.01"


[libraries]
# --- AndroidX Core & UI ---
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose-android = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose-android", version.ref = "lifecycleRuntimeComposeAndroid" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewModelCompose" }
databinding-adapters = { group = "androidx.databinding", name = "adapters", version = "3.2.0-alpha11" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }


# --- Jetpack Compose ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" } # Declarar como platform()
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
androidx-compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata", version.ref = "composeRuntimeLivedata" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" } # Versão gerenciada pelo composeBom
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" } # Versão gerenciada pelo composeBom
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" } # Versão gerenciada pelo composeBom
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }


# --- Firebase ---
google-firebase-auth = { group = "com.google.firebase", name = "firebase-auth" } # Versão sem KTX para Hilt injection (se necessário)
google-firebase-auth-ktx = { module = "com.google.firebase:firebase-auth-ktx", version.ref = "firebaseAuthKtx" } # Versão gerenciada pelo firebaseBom
google-firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" } # Declarar como platform()
google-firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" } # Versão sem KTX para Hilt injection (se necessário)
google-firebase-firestore-ktx = { module = "com.google.firebase:firebase-firestore-ktx", version.ref = "firebaseFirestoreKtx" } # Versão gerenciada pelo firebaseBom


# --- Hilt (Dependency Injection) ---
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-navigation-fragment = { module = "androidx.hilt:hilt-navigation-fragment", version.ref = "hiltNavigationFragment" }
google-hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltAndroid" }
google-hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hiltAndroid" } # Kapt/KSP


# --- Networking (Retrofit) ---
google-code-gson = { module = "com.google.code.gson:gson", version.ref = "gson" } # Dependência do converter-gson
squareup-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
squareup-retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofitGsonConverter" }


# --- Coroutines ---
jetbrains-kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutinesAndroid" }
jetbrains-kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }


# --- Room (Persistence) ---
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" } # Kapt/KSP
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }


# --- Test Dependencies ---
test-androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "testComposeBom" } # Declarar como platform() em testImplementation
test-androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
test-androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
test-androidx-junit = { module = "androidx.test.ext:junit", version.ref = "extJunit" }
test-junit = { module = "junit:junit", version.ref = "junit" }


# --- Debug/Tooling Dependencies (geralmente em debugImplementation) ---
debug-androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
debug-androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }


[bundles]
compose = [
    "androidx-activity-compose",
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview", # Essencial para previews no AS
    "androidx-compose-material3",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-navigation-compose",
    "androidx-compose-runtime-livedata",
]
firebase = [ # BOM declarado separadamente com platform(libs.google.firebase.bom)
    "google-firebase-firestore-ktx",
    "google-firebase-firestore",
    "google-firebase-auth-ktx",
    "google-firebase-auth",
]
hilt-runtime = [ # Compilador declarado separadamente com kapt/ksp(libs.google.hilt.android.compiler)
    "google-hilt-android",
    "androidx-hilt-navigation-compose", # Se usar compose
    # "androidx-hilt-navigation-fragment", # Se usar fragments
]
retrofit = [
    "squareup-retrofit",
    "squareup-retrofit-converter-gson",
    "google-code-gson", # Incluído pois é dependência direta do converter
]
room-runtime = [ # Compilador declarado separadamente com kapt/ksp(libs.androidx.room.compiler)
    "androidx-room-runtime",
    "androidx-room-ktx",
]
test-core = [
    "test-junit",
    "test-androidx-junit",
    "test-androidx-espresso-core",
]


[plugins]
# Android Gradle Plugins
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "androidLibraryPlugin" } # Usando a versão de library

# Kotlin Plugins
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" } # NOVO: Plugin para módulos JVM puros
kotlinKapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" } # Se ainda usar Kapt (geralmente para Hilt/Room sem KSP)
kotlinParcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlinComposeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinComposeCompiler" }

# Ferramentas de Processamento de Anotações
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hiltAndroid" }

# Plugins de Serviços (Firebase)
googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" } # Já estava com version.ref